name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install onnxruntime numpy pillow tokenizers
      - name: AI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_ai_assets.py
      - name: AI self-test
        continue-on-error: true
        run: python tools/ai_selftest.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-assets
          path: |
            fotobudka/_model.py
            fotobudka/data/labels.npz

  build:
    needs: models
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ai-assets
          path: fotobudka

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set version
        shell: bash
        run: echo 'VERSION = "1.0.${{ github.run_number }}"' > fotobudka/_version.py

      - name: Build EXE
        run: >
          pyinstaller main.py --name Fotobudka_v1.0.${{ github.run_number }} --onefile --windowed --noconfirm
          --add-data "fotobudka/data;fotobudka/data"
          --exclude-module tkinter
          --exclude-module PySide6.QtNetwork
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick

      - uses: actions/upload-artifact@v4
        with:
          name: Fotobudka-Windows
          path: dist/Fotobudka_v1.0.${{ github.run_number }}.exe

      - name: Publish release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fotobudka 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Pobierz **Fotobudka_v1.0.${{ github.run_number }}.exe** poniżej (Assets)."
          files: dist/Fotobudka_v1.0.${{ github.run_number }}.exe
